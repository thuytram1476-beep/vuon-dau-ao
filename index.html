 if(m==3&&r.par[0]=='AaBb'){const [vt,vn,xt,xn]=r.c;h+=`<p class="note">Vàng : xanh = ${vt+vn} : ${xt+xn} ≈ ${((vt+vn)/(xt+xn)).toFixed(2)} : 1<br>Trơn : nhăn = ${vt+xt} : ${vn+xn} ≈ ${((vt+xt)/(vn+xn)).toFixed(2)} : 1<br>Mendel: 315 : 108 : 101 : 32 ≈ 9 : 3 : 3 : 1</p>`}
 if(m==2)h+=`<p class="note">${r.c.filter(x=>x>0).length==1?'Đời con đồng loạt một kiểu hình → cây kiểm tra là AA.':'Đời con phân li (khoảng 1 : 1) → cây kiểm tra là Aa.'}</p>`;
 if(m==1&&S.inc&&r.par[0]=='Aa')h+=`<p class="note">Trội không hoàn toàn: F2 phân li kiểu hình 1 đậm : 2 nhạt : 1 trắng, trùng tỉ lệ kiểu gene.</p>`;
 if(m==1&&r.N<=8)h+=`<p class="note">Mẫu nhỏ nên tỉ lệ dao động mạnh – hãy bấm “Lai lại”.</p>`;
 el.innerHTML=h}
function hist(){const m=S.mode,H=S.hist[m],o=ORD[m];$('#hist').innerHTML=H.length?`<h3>Bảng số liệu</h3><table><tr><th>Phép lai</th><th>N</th>${o.map(i=>`<th>${PL[m][i].replace('Hoa ','').replace(', ','/')}</th>`).join('')}</tr>${H.slice(-8).reverse().map(h=>`<tr><td>${h.label}${m==2&&S.rev?' ('+h.par[0]+')':''}</td><td>${h.N}</td>${o.map(i=>`<td>${h.c[i]}</td>`).join('')}</tr>`).join('')}</table>`:''}
function pun(){const m=S.mode,el=$('#pun'),p=S.cur;if(!p||(m==2&&!S.rev)||p[0]=='AAAA'){el.innerHTML='';return}
 const a=gametes(p[0]),b=gametes(p[1]);
 el.innerHTML=`<h3>Bảng tổ hợp giao tử</h3><table class="pun"><tr><th>${p[0]} × ${p[1]}</th>${b.map(x=>`<th>${x}</th>`).join('')}</tr>${a.map(x=>`<tr><th>${x}</th>${b.map(y=>{const g=comb(x,y);return `<td style="background:${PC[m][phen(g,m)]}">${g}</td>`}).join('')}</tr>`).join('')}</table>`}
function init(){const m=S.mode;setPal();tabs();$('#desc').textContent=MODES[m][1];S.cur=null;
 if(m==2&&!S.sec)S.sec=Math.random()<.5?{X:'AA',Y:'Aa'}:{X:'Aa',Y:'AA'};
 ctl();res(null);hist();pun();
 refresh()}
init();
</script>
