<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vườn đậu ảo 3D – Các quy luật di truyền của Mendel</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#14231a;--tx:#f1f5e8;--mu:#a9bba4;--ac:#b690f0;--sun:#f4d35e;--lf:#7fc15a;--ln:rgba(255,255,255,.14)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:14px/1.5 'Be Vietnam Pro',system-ui,sans-serif;color:var(--tx);background:#9cc6e6}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#p{position:fixed;top:12px;right:12px;bottom:12px;width:390px;overflow:auto;padding:18px;border-radius:18px;background:rgba(20,35,26,.84);backdrop-filter:blur(14px);border:1px solid var(--ln)}
h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.5px}
.sub{margin:2px 0 12px;color:var(--mu);font-size:12.5px}
#tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--ln);background:rgba(255,255,255,.07);border-radius:10px;padding:8px 10px}
button:hover{background:rgba(255,255,255,.15)}button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
button.on{background:var(--ac);color:#1a1030;border-color:var(--ac);font-weight:600}
button.go{background:var(--lf);color:#10240a;border-color:var(--lf);font-weight:600}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;align-items:center}.row>b{font-size:12px;color:var(--mu);font-weight:400;min-width:74px}
#desc{color:var(--mu);margin:0 0 8px}
section{border-top:1px solid var(--ln);padding-top:10px;margin-top:10px}
h3{margin:0 0 6px;font-size:13px;color:var(--sun);font-weight:600}
.bar{display:grid;grid-template-columns:92px 1fr 54px;gap:8px;align-items:center;margin:4px 0;font-size:13px}
.bar i{display:block;height:14px;border-radius:7px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:22px;font-weight:800;margin:6px 0}.note{color:var(--mu);font-size:12.5px}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:4px 5px;border-bottom:1px solid var(--ln);text-align:center}th{color:var(--mu);font-weight:400}
.pun td,.pun th{border:1px solid var(--ln);padding:5px 2px;font-weight:600}.pun td{color:#111;text-shadow:0 0 2px rgba(255,255,255,.4)}
#hint{position:fixed;left:16px;bottom:14px;color:#fff;font-size:12px;text-shadow:0 1px 4px #0008}
@media(max-width:760px){#p{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:52vh}#hint{display:none}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<aside id="p">
  <h1>Vườn đậu ảo</h1>
  <p class="sub">Mô phỏng 3D các quy luật di truyền của Mendel – KHTN 9, Bài 37</p>
  <div id="tabs"></div>
  <p id="desc"></p>
  <div id="ctl"></div>
  <section id="res"></section>
  <section id="pun"></section>
  <section id="hist"></section>
</aside>
<div id="hint">Kéo chuột để xoay · cuộn để phóng to/thu nhỏ</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
/* ---------- Di truyền học ---------- */
const rnd=n=>Math.random()*n|0;
const gametes=g=>{let r=[''];for(let i=0;i<g.length;i+=2){const u=[...new Set([g[i],g[i+1]])];r=r.flatMap(x=>u.map(a=>x+a))}return r};
const gam1=g=>{let s='';for(let i=0;i<g.length;i+=2)s+=g[i+rnd(2)];return s};
const comb=(a,b)=>{let s='';for(let i=0;i<a.length;i++){const x=a[i],y=b[i];s+=x<y?x+y:y+x}return s};
const phen=(g,m)=>m==3?(/A/.test(g)?0:2)+(/B/.test(g)?0:1):(/A/.test(g)?0:1);
const PL={1:['Hoa tím','Hoa trắng'],2:['Hoa tím','Hoa trắng'],3:['Vàng, trơn','Vàng, nhăn','Xanh, trơn','Xanh, nhăn']};
const PC={1:['#8e44c9','#f3f0ff'],2:['#8e44c9','#f3f0ff'],3:['#e8c230','#d9a516','#7cb342','#4f8a2b']};
const ORD={1:[0,1],2:[0,1],3:[0,2,1,3]};
const ratio=c=>{const m=Math.min(...c.filter(x=>x>0));return c.map(x=>+(x/m).toFixed(2)).join(' : ')};
/* ---------- Cảnh 3D ---------- */
const cv=$('#c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(48,1,.1,900);
scene.fog=new THREE.Fog(0xdfe9d3,50,260);
scene.add(new THREE.Mesh(new THREE.SphereGeometry(420,16,12),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
 vertexShader:'varying vec3 v;void main(){v=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'varying vec3 v;void main(){float h=normalize(v).y;gl_FragColor=vec4(mix(vec3(.9,.92,.84),vec3(.3,.58,.88),smoothstep(0.,.55,h)),1.);}'})));
scene.add(new THREE.HemisphereLight(0xcfe8ff,0x4a5a30,.75));
const sun=new THREE.DirectionalLight(0xfff0cf,1.15);sun.position.set(30,45,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const gg=new THREE.PlaneGeometry(700,700,70,70);gg.rotateX(-Math.PI/2);
for(let i=0;i<gg.attributes.position.count;i++){const x=gg.attributes.position.getX(i),z=gg.attributes.position.getZ(i),r=Math.hypot(x,z);gg.attributes.position.setY(i,r>50?Math.sin(x*.04)*Math.cos(z*.05)*5*Math.min(1,(r-50)/80):0)}
gg.computeVertexNormals();
const ground=new THREE.Mesh(gg,new THREE.MeshStandardMaterial({color:0x5f9e3f,roughness:1}));ground.position.y=-.02;ground.receiveShadow=true;scene.add(ground);
function merge(gs){const p=[],n=[],ix=[];let o=0;gs.forEach(g=>{p.push(...g.attributes.position.array);n.push(...g.attributes.normal.array);g.index.array.forEach(i=>ix.push(i+o));o+=g.attributes.position.count});
 const m=new THREE.BufferGeometry();m.setAttribute('position',new THREE.Float32BufferAttribute(p,3));m.setAttribute('normal',new THREE.Float32BufferAttribute(n,3));m.setIndex(ix);return m}
const GF=(()=>{const a=[];for(let i=0;i<5;i++){const t=i/5*6.283,s=new THREE.SphereGeometry(.09,8,6);s.scale(1.35,.5,1);s.rotateY(-t);s.translate(Math.cos(t)*.09,0,Math.sin(t)*.09);a.push(s)}
 const c=new THREE.SphereGeometry(.06,8,6);c.translate(0,.04,0);a.push(c);return merge(a)})();
const GS=new THREE.CylinderGeometry(.02,.035,1,6).translate(0,.5,0),GL=new THREE.SphereGeometry(.13,8,6).scale(1,.14,.55).translate(.12,0,0);
const GR=new THREE.SphereGeometry(1,16,12),GW=new THREE.IcosahedronGeometry(1,2);
{const p=GW.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),k=1+.11*Math.sin(x*8)*Math.sin(y*7)*Math.sin(z*9);p.setXYZ(i,x*k,y*k*.92,z*k)}GW.computeVertexNormals()}
const MS=new THREE.MeshStandardMaterial({color:0x4f8f2f,roughness:.8}),ML=new THREE.MeshStandardMaterial({color:0x6bb043,roughness:.7,side:THREE.DoubleSide}),
 MF=new THREE.MeshStandardMaterial({roughness:.45}),MD=new THREE.MeshStandardMaterial({roughness:.35}),MG=new THREE.MeshStandardMaterial({color:0x4d8f2c,roughness:1}),
 MB=new THREE.MeshStandardMaterial({color:0x4a3222,roughness:1});
const dm=new THREE.Object3D();
function put(m,i,x,y,z,rx,ry,rz,sx,sy,sz){dm.position.set(x,y,z);dm.rotation.set(rx,ry,rz);dm.scale.set(sx,sy,sz);dm.updateMatrix();m.setMatrixAt(i,dm.matrix)}
const ease=t=>1-Math.pow(1-t,3),bounce=t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375};
let cur=null;
function build(ph,m){
 if(cur){scene.remove(cur.g);cur.ms.forEach(x=>x.dispose())}
 const N=ph.length,g=new THREE.Group(),ms=[],seed=m==3;
 const cols=Math.ceil(Math.sqrt(N*1.5)),rows=Math.ceil(N/cols);
 const sp=seed?(N<=16?1.8:N<=200?.55:.42):(N<=16?2.4:N<=200?1.1:.75),w=cols*sp,d=rows*sp,ext=Math.max(w,d);
 const bed=new THREE.Mesh(new THREE.BoxGeometry(w+2,.12,d+2),MB);bed.position.y=-.04;bed.receiveShadow=true;g.add(bed);
 const gr=new THREE.InstancedMesh(new THREE.ConeGeometry(.05,.55,3).translate(0,.27,0),MG,2600);
 for(let i=0,k=0;k<2600;i++){const a=Math.random()*6.283,r=Math.sqrt(Math.random())*75,x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.abs(x)<w/2+1.3&&Math.abs(z)<d/2+1.3)continue;put(gr,k++,x,0,z,0,Math.random()*6,0,1,.6+Math.random()*1.2,1)}
 g.add(gr);ms.push(gr);
 const X=[],Z=[],DL=[],RT=[];for(let i=0;i<N;i++){X.push(((i%cols)-(cols-1)/2)*sp+(Math.random()-.5)*sp*.25);Z.push((((i/cols)|0)-(rows-1)/2)*sp+(Math.random()-.5)*sp*.25);DL.push(Math.random()*1.6);RT.push(Math.random()*6.3)}
 const col=new THREE.Color();let upd;
 if(!seed){
  const H=sp*.95,st=new THREE.InstancedMesh(GS,MS,N),lf=new THREE.InstancedMesh(GL,ML,N*2),fl=new THREE.InstancedMesh(GF,MF,N);
  [st,lf,fl].forEach(x=>{x.castShadow=true;g.add(x);ms.push(x)});
  for(let i=0;i<N;i++){col.set(ph[i]?0xf8f4ff:[0x8e44c9,0x9b59d0,0x7d3cb8][i%3]);fl.setColorAt(i,col)}
  upd=t=>{for(let i=0;i<N;i++){const k=ease(clamp((t-DL[i])*.7,0,1)),h=H*k,sw=Math.sin(t*1.5+X[i]*.7+Z[i]*.5)*.05*k;
   put(st,i,X[i],0,Z[i],0,RT[i],sw,H*.9,h,H*.9);
   const fx=X[i]-Math.sin(sw)*h,fy=Math.cos(sw)*h;
   put(fl,i,fx,fy,Z[i],.5,RT[i],sw,H*k,H*k,H*k);
   put(lf,2*i,X[i],h*.45,Z[i],0,RT[i],sw+.3,H*k,H*k,H*k);put(lf,2*i+1,X[i],h*.7,Z[i],0,RT[i]+3.14,sw-.3,H*k,H*k,H*k)}
   [st,lf,fl].forEach(x=>x.instanceMatrix.needsUpdate=true)};
 }else{
  const r=sp*.4,idR=[],idW=[];ph.forEach((p,i)=>(p%2?idW:idR).push(i));
  const mr=new THREE.InstancedMesh(GR,MD,Math.max(1,idR.length)),mw=new THREE.InstancedMesh(GW,MD,Math.max(1,idW.length));
  [[mr,idR],[mw,idW]].forEach(([x,id])=>{x.count=id.length;x.castShadow=x.receiveShadow=true;g.add(x);ms.push(x);id.forEach((q,j)=>x.setColorAt(j,col.set(PC[3][ph[q]<2?0:2]).multiplyScalar(ph[q]<2?1:1)))});
  upd=t=>{[[mr,idR],[mw,idW]].forEach(([x,id])=>{id.forEach((q,j)=>{const k=clamp((t-DL[q]*.6)*.8,0,1),y=r+(1-bounce(k))*6*(1-k*.5);put(x,j,X[q],y,Z[q],RT[q],RT[q]*2,0,r,r,r)});x.instanceMatrix.needsUpdate=true})};
 }
 scene.add(g);cur={g,ms,upd,t0:clock.getElapsedTime()};
 sun.shadow.camera.left=sun.shadow.camera.bottom=-ext*.75-8;sun.shadow.camera.right=sun.shadow.camera.top=ext*.75+8;sun.shadow.camera.far=200;sun.shadow.camera.updateProjectionMatrix();
 sun.target.position.set(0,0,0);scene.add(sun.target);
 cc.td=Math.max(11,ext*(seed?1.15:1.0)+7);cc.ty=ext*.05+.4;cc.bee=ext;
}
/* ong mat ngot */
const bees=[];for(let i=0;i<4;i++){const b=new THREE.Group(),bd=new THREE.Mesh(new THREE.SphereGeometry(.14,10,8).scale(1,.8,1.4),new THREE.MeshStandardMaterial({color:0xf2c200}));
 const wm=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.6,side:THREE.DoubleSide}),w1=new THREE.Mesh(new THREE.PlaneGeometry(.18,.1),wm),w2=w1.clone();
 w1.position.set(.1,.12,0);w2.position.set(-.1,.12,0);b.add(bd,w1,w2);b.w=[w1,w2];b.ph=i*1.7;scene.add(b);bees.push(b)}
/* camera tự xoay */
const cc={th:.7,ph:1.0,d:16,td:16,ty:.5,ty0:.5,bee:10,idle:0};
let drag=false,lx=0,ly=0;
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cc.idle=0;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});
cv.addEventListener('pointerup',()=>{drag=false;cv.style.cursor='grab'});
cv.addEventListener('pointermove',e=>{if(!drag)return;cc.th-=(e.clientX-lx)*.006;cc.ph=clamp(cc.ph-(e.clientY-ly)*.005,.25,1.5);lx=e.clientX;ly=e.clientY});
cv.addEventListener('wheel',e=>{e.preventDefault();cc.td=clamp(cc.td*(1+e.deltaY*.001),4,120);cc.idle=0},{passive:false});
function size(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',size);size();
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime();cc.idle+=.016;
 if(!drag&&cc.idle>3)cc.th+=.0016;cc.d+=(cc.td-cc.d)*.05;cc.ty0+=(cc.ty-cc.ty0)*.05;
 cam.position.set(Math.sin(cc.th)*Math.sin(cc.ph)*cc.d,cc.ty0+Math.cos(cc.ph)*cc.d,Math.cos(cc.th)*Math.sin(cc.ph)*cc.d);cam.lookAt(0,cc.ty0,0);
 if(cur)cur.upd(t-cur.t0);
 bees.forEach(b=>{const s=t*.5+b.ph,e=cc.bee*.45+2;b.position.set(Math.sin(s*1.3)*e,1.2+Math.sin(s*2.1)*.5,Math.cos(s)*e);b.rotation.y=-s*1.3+Math.PI/2;const f=Math.sin(t*60)*.6;b.w[0].rotation.z=f;b.w[1].rotation.z=-f});
 R.render(scene,cam)}
loop();
/* ---------- Giao diện & logic thí nghiệm ---------- */
const S={mode:1,N:{1:100,2:100,3:556},hist:{1:[],2:[],3:[]},last:{},pred:null,sec:null,rev:false};
const MODES={1:['Quy luật phân li','Cho F1 (Aa × Aa) tự thụ ở các cỡ mẫu khác nhau. Dự đoán trước, rồi quan sát tỉ lệ kiểu hình ở F2.'],
 2:['Hộp đen – lai phân tích','Hai cây hoa tím X và Y chưa biết kiểu gene. Lai từng cây với cây hoa trắng (aa) để xác định.'],
 3:['Phân li độc lập','Lai hai cặp tính trạng: hạt vàng/xanh (A/a) và vỏ trơn/nhăn (B/b). Xét riêng từng cặp rồi so với tỉ lệ chung.']};
const Ns={1:[8,100,1000],2:[20,100,500],3:[16,160,556]};
function tabs(){$('#tabs').innerHTML=[1,2,3].map(m=>`<button class="${m==S.mode?'on':''}" data-m="${m}">${['','Phân li','Hộp đen','Hai cặp'][m]}</button>`).join('');
 $('#tabs').onclick=e=>{const m=+e.target.dataset.m;if(m){S.mode=m;init()}}}
function ctl(){const m=S.mode;let h=`<div class="row"><b>Số cây con</b>${Ns[m].map(n=>`<button class="${S.N[m]==n?'on':''}" data-n="${n}">${n}${m==3&&n==556?' (Mendel)':''}</button>`).join('')}</div>`;
 if(m==1)h+=`<div class="row"><b>Dự đoán F2<br>tím : trắng</b>${[1,2,3,4].map(p=>`<button class="${S.pred==p?'on':''}" data-p="${p}">${p} : 1</button>`).join('')}</div><div class="row"><button class="go" data-a="f2">Lai F1 × F1 (Aa × Aa)</button><button data-a="p">Xem F1 (AA × aa)</button><button data-a="again">Lai lại</button></div>`;
 if(m==2)h+=`<div class="row"><button class="go" data-a="x">Lai X × aa</button><button class="go" data-a="y">Lai Y × aa</button></div><div class="row"><button data-a="new">Đổi cặp cây mới</button><button data-a="rev">${S.rev?'Ẩn kiểu gene':'Tiết lộ kiểu gene'}</button></div>`;
 if(m==3)h+=`<div class="row"><button class="go" data-a="f2">Lai F1 × F1 (AaBb × AaBb)</button><button data-a="p">Xem F1 (AABB × aabb)</button><button data-a="again">Lai lại</button></div>`;
 $('#ctl').innerHTML=h;
 $('#ctl').onclick=e=>{const t=e.target,m=S.mode;if(t.dataset.n){S.N[m]=+t.dataset.n;ctl()}else if(t.dataset.p){S.pred=+t.dataset.p;ctl()}else if(t.dataset.a)act(t.dataset.a)}}
function act(a){const m=S.mode,n=S.N[m];
 const F={p:()=>run(m==3?['AABB','aabb']:['AA','aa'],m==3?16:8,m==3?'P → F1':'P → F1'),f2:()=>run(m==3?['AaBb','AaBb']:['Aa','Aa'],n,'F1 × F1'),
  x:()=>run([S.sec.X,'aa'],n,'X × aa'),y:()=>run([S.sec.Y,'aa'],n,'Y × aa')};
 if(a=='again'){(S.last[m]||F.f2)();return}
 if(a=='new'){S.sec=Math.random()<.5?{X:'AA',Y:'Aa'}:{X:'Aa',Y:'AA'};S.rev=false;S.hist[2]=[];res(null);hist();pun();ctl();return}
 if(a=='rev'){S.rev=!S.rev;ctl();pun();hist();return}
 S.last[m]=F[a];F[a]()}
function run(par,N,label){const m=S.mode,c=[0,0,0,0].slice(0,PL[m].length),ph=[];
 for(let i=0;i<N;i++){const p=phen(comb(gam1(par[0]),gam1(par[1])),m);c[p]++;ph.push(p)}
 for(let i=N-1;i>0;i--){const j=rnd(i+1);[ph[i],ph[j]]=[ph[j],ph[i]]}
 S.hist[m].push({label:label,N,c,par});S.cur=par;build(ph,m);res({c,N,par,label});hist();pun()}
function res(r){const m=S.mode,el=$('#res');if(!r){el.innerHTML='<p class="note">Chọn thao tác phía trên để bắt đầu lai.</p>';return}
 const o=ORD[m],mx=Math.max(...r.c);
 let h=`<h3>Kết quả: ${r.label} · N = ${r.N}</h3>`+o.map(i=>`<div class="bar"><span>${PL[m][i]}</span><span><i style="width:${r.c[i]/mx*100}%;background:${PC[m][i]}"></i></span><span>${r.c[i]} (${(r.c[i]/r.N*100).toFixed(1)}%)</span></div>`).join('');
 const rc=o.map(i=>r.c[i]);
 if(r.c.filter(x=>x>0).length>1)h+=`<div class="big">${ratio(rc)}</div>`;else h+=`<div class="big">100% ${PL[m][o[rc.findIndex(x=>x>0)]].toLowerCase()}</div>`;
 if(m==1&&S.pred&&r.par[0]=='Aa'){const q=r.c[1]?r.c[0]/r.c[1]:99;h+=`<p class="note">Em dự đoán ${S.pred} : 1 → ${Math.abs(q-S.pred)<.6?'khá gần kết quả.':'chưa khớp; hãy lai lại ở cỡ mẫu lớn hơn.'}</p>`}
 if(m==3&&r.par[0]=='AaBb'){const [vt,vn,xt,xn]=r.c;h+=`<p class="note">Vàng : xanh = ${vt+vn} : ${xt+xn} ≈ ${((vt+vn)/(xt+xn)).toFixed(2)} : 1<br>Trơn : nhăn = ${vt+xt} : ${vn+xn} ≈ ${((vt+xt)/(vn+xn)).toFixed(2)} : 1<br>Mendel: 315 : 108 : 101 : 32 ≈ 9 : 3 : 3 : 1</p>`}
 if(m==2&&r.c[1]!==undefined)h+=`<p class="note">${r.c[1]==0?'Đời con toàn hoa tím → cây kiểm tra nhiều khả năng là AA.':'Xuất hiện hoa trắng (khoảng 1 : 1) → cây kiểm tra là Aa.'}</p>`;
 if(m==1&&r.N<=8)h+=`<p class="note">Mẫu nhỏ nên tỉ lệ dao động mạnh – hãy bấm “Lai lại”.</p>`;
 el.innerHTML=h}
